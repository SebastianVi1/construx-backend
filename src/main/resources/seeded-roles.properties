# Built-in roles created for every NEW organization, besides OWNER (which always has everything).
# Edit this file to change names or permissions; no Java changes needed. Rules:
#  - `roles` lists the role codes, in creation order. Codes are reserved for custom roles.
#  - role.<CODE>.name: display name stored with the role.
#  - role.<CODE>.grants: comma separated ACTION:SCOPE pairs.
#    Actions: MANAGE_ORGANIZATION, MANAGE_ROLES, MANAGE_MEMBERS, VIEW_PROJECT, MANAGE_PROJECT,
#             VIEW_GOAL, MANAGE_GOAL, VIEW_ACTIVITY, MANAGE_ACTIVITY, ASSIGN_ACTIVITY,
#             VIEW_PRICES, MANAGE_PRICES (organization scope only)
#    Scopes:  ORGANIZATION, PROJECT (only sites the member is assigned to), OWN (only own tasks)
#    Invalid pairs (e.g. MANAGE_ROLES:PROJECT) fail at startup and in tests.
# Existing organizations keep the permissions they were created with; a Flyway migration
# backfills any new grant (see V11__price_permissions.sql).
roles=ADMINISTRATOR,MEMBER,WORKER,FINANCE

role.ADMINISTRATOR.name=Administrador
role.ADMINISTRATOR.grants=MANAGE_ROLES:ORGANIZATION,MANAGE_MEMBERS:ORGANIZATION,\
  VIEW_PROJECT:ORGANIZATION,MANAGE_PROJECT:ORGANIZATION,VIEW_GOAL:ORGANIZATION,MANAGE_GOAL:ORGANIZATION,\
  VIEW_ACTIVITY:ORGANIZATION,MANAGE_ACTIVITY:ORGANIZATION,ASSIGN_ACTIVITY:ORGANIZATION,\
  VIEW_PRICES:ORGANIZATION,MANAGE_PRICES:ORGANIZATION

role.MEMBER.name=Miembro
role.MEMBER.grants=VIEW_PROJECT:ORGANIZATION,VIEW_GOAL:ORGANIZATION,MANAGE_GOAL:ORGANIZATION,\
  VIEW_ACTIVITY:ORGANIZATION,MANAGE_ACTIVITY:ORGANIZATION,ASSIGN_ACTIVITY:ORGANIZATION,\
  VIEW_PRICES:ORGANIZATION

role.WORKER.name=Trabajador
role.WORKER.grants=VIEW_PROJECT:PROJECT,VIEW_GOAL:PROJECT,VIEW_ACTIVITY:PROJECT,MANAGE_ACTIVITY:OWN

role.FINANCE.name=Finanzas
role.FINANCE.grants=VIEW_PROJECT:ORGANIZATION,VIEW_PRICES:ORGANIZATION,MANAGE_PRICES:ORGANIZATION
