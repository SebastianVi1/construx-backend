<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
        <tr>
          <td style="padding:0 4px 20px 4px;">
            <img src="cid:construx-logo" width="160" height="32" alt="Construx" style="display:block;border:0;outline:none;text-decoration:none;width:160px;height:32px;">
          </td>
        </tr>
        <tr>
          <td style="background-color:#ffffff;border-radius:8px;border-top:4px solid #ff7a1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2937;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:36px 40px 8px 40px;">
                  <h1 style="margin:0 0 20px 0;font-size:22px;line-height:30px;font-weight:700;color:#0a1628;">{{heading}}</h1>
                  {{paragraphs}}
                </td>
              </tr>
              <tr>
                <td style="padding:12px 40px 28px 40px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="border-radius:6px;background-color:#0a1628;">
                        <a href="{{actionUrl}}" target="_blank" style="display:inline-block;padding:13px 28px;font-size:15px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:6px;">{{actionLabel}}</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td style="padding:0 40px 32px 40px;">
                  <p style="margin:0 0 16px 0;font-size:14px;line-height:21px;color:#4b5563;">{{note}}</p>
                  <p style="margin:0;padding-top:16px;border-top:1px solid #e5e7eb;font-size:12px;line-height:18px;color:#6b7280;">
                    Si el botón no funciona, copia y pega este enlace en tu navegador:<br>
                    <a href="{{actionUrl}}" target="_blank" style="color:#0a1628;word-break:break-all;">{{actionUrl}}</a>
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 16px 0 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#6b7280;">
            Construx · Gestión de obras para empresas constructoras<br>
            Este es un correo automático, por favor no respondas a este mensaje.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
