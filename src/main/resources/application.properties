spring.application.name=construx
# Load local development values from the project root; environment variables still work in deployments.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB_NAME}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

#oauth2.0
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Application JWTs are signed locally; supply a stable Base64-encoded 32+ byte secret.
app.security.jwt-secret=${JWT_SECRET}
app.security.issuer=${JWT_ISSUER:construx}
app.security.audience=${JWT_AUDIENCE:construx-api}
app.security.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.security.mail-from=${MAIL_FROM}
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# Existing databases were created by Hibernate ddl-auto; adopt them as version 1 instead of failing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Per-client limit on unauthenticated auth endpoints (per application instance)
app.security.rate-limit.max-requests=${RATE_LIMIT_MAX:10}
app.security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# Only the health probe is exposed, without component details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Multipart limits sit above the CSV import's own 1 MB check, so oversized files get its 400 VALIDATION_FAILED instead of a bare 413
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Plan files live in a private S3 bucket; credentials come from the AWS default chain (AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY or AWS_PROFILE). Without AWS_BUCKET_NAME the app starts, but plan uploads fail
aws.region=${AWS_REGION:us-east-1}
aws.bucket.name=${AWS_BUCKET_NAME:}
